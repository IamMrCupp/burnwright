# Spike for #12: does upstream minipro build and run on Windows?
#
# Builds vendor/minipro under MSYS2 on windows-latest, for the pinned tag and
# for upstream master, with both the MINGW64 (msvcrt) and UCRT64 toolchains.
# All glue lives here; the submodule is never patched.
#
# Upstream's Makefile already has a Windows branch: when OS=Windows_NT it links
# src/usb_win.c (native WinUSB + SetupAPI) instead of src/usb_nix.c (libusb),
# so libusb is not a build or runtime dependency on Windows.

name: minipro · Windows

on:
  pull_request:
    paths:
      - vendor/minipro
      - .github/workflows/minipro-windows.yml
  push:
    branches: [main]
    paths:
      - vendor/minipro
      - .github/workflows/minipro-windows.yml
  workflow_dispatch:

concurrency:
  group: minipro-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: minipro ${{ matrix.ref }} · ${{ matrix.msystem }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # "pinned" = whatever commit the submodule is pinned to (tag 0.7.4).
        # "master" = upstream master tip, to see whether T76 support builds too.
        ref: [pinned, master]
        msystem: [UCRT64, MINGW64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make
          pacboy: >-
            gcc:p
            pkgconf:p
            zlib:p
            ntldd:p

      - name: Check out upstream master
        if: matrix.ref == 'master'
        working-directory: vendor/minipro
        run: |
          git fetch --no-tags origin master
          git checkout --detach FETCH_HEAD

      - name: Record source revision
        working-directory: vendor/minipro
        run: |
          git config --global --add safe.directory '*'
          echo "minipro $(git describe --tags --always) ($(git rev-parse HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          gcc --version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

      # 1. Upstream build as-is: dynamic link, upstream's default CFLAGS.
      - name: Build (dynamic, upstream defaults)
        working-directory: vendor/minipro
        run: make -j"$(nproc)"

      - name: Smoke test (dynamic, inside MSYS2)
        working-directory: vendor/minipro
        run: |
          set -x
          db="--infoic infoic.xml --logicic logicic.xml"
          ./minipro.exe $db --version
          # -q picks the database without a programmer attached; without it
          # minipro prompts on stdin.
          ./minipro.exe $db -q tl866ii -l > devices.txt
          wc -l devices.txt
          head -5 devices.txt
          test "$(wc -l < devices.txt)" -gt 1000
          ./minipro.exe $db -q t48 -L 27C256
          ./minipro.exe $db -q t48 -d AT27C256@DIP28
          # No programmer is attached in CI, so these must fail cleanly.
          ./minipro.exe -k && exit 1 || echo "presence check failed as expected (exit $?)"

      - name: DLL dependencies (dynamic)
        working-directory: vendor/minipro
        run: ntldd -R minipro.exe | tee ntldd-dynamic.txt

      - name: Stage dynamic bundle
        working-directory: vendor/minipro
        run: |
          out="$GITHUB_WORKSPACE/out/dynamic"
          mkdir -p "$out"
          cp minipro.exe infoic.xml logicic.xml ntldd-dynamic.txt "$out/"
          # Copy every non-system DLL ntldd resolved from the MSYS2 prefix.
          prefix="$(cygpath -m "$MINGW_PREFIX")"
          grep -i "=> ${prefix}" ntldd-dynamic.txt | awk '{print $3}' | sort -u | while read -r dll; do
            cp "$(cygpath -u "$dll")" "$out/"
          done
          ls -l "$out"

      # 2. Static build: the shape a Tauri sidecar wants (one .exe, no DLLs).
      - name: Build (static)
        working-directory: vendor/minipro
        run: |
          make clean
          make -j"$(nproc)" CFLAGS="-O2 -Wall" LDFLAGS="-static"
          ntldd -R minipro.exe | tee ntldd-static.txt
          if grep -i "=> $(cygpath -m "$MINGW_PREFIX")" ntldd-static.txt; then
            echo "::error::static build still depends on MSYS2 DLLs"
            exit 1
          fi
          out="$GITHUB_WORKSPACE/out/static"
          mkdir -p "$out"
          cp minipro.exe infoic.xml logicic.xml ntldd-static.txt "$out/"

      # 3. Run both bundles from plain PowerShell with no MSYS2 on PATH, the
      #    way burnwright will spawn the sidecar on a user's machine.
      - name: Smoke test outside MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($kind in 'dynamic', 'static') {
            Push-Location "out/$kind"
            Write-Host "== $kind =="
            .\minipro.exe --infoic infoic.xml --logicic logicic.xml --version
            if ($LASTEXITCODE -ne 0) { throw "$kind --version exited $LASTEXITCODE" }
            $devices = .\minipro.exe --infoic infoic.xml --logicic logicic.xml -q tl866ii -l
            if ($LASTEXITCODE -ne 0) { throw "$kind -l exited $LASTEXITCODE" }
            Write-Host "$kind lists $($devices.Count) devices"
            if ($devices.Count -lt 1000) { throw "$kind device list too short" }
            .\minipro.exe -k
            Write-Host "presence check exit code: $LASTEXITCODE (non-zero expected, no programmer)"
            Pop-Location
          }
          # Default database location on Windows is %ProgramData%\minipro\.
          New-Item -ItemType Directory -Force "$env:ProgramData\minipro" | Out-Null
          Copy-Item out/static/infoic.xml, out/static/logicic.xml "$env:ProgramData\minipro\"
          $count = (out/static/minipro.exe -q tl866ii -l).Count
          Write-Host "static, default DB path: $count devices"
          if ($LASTEXITCODE -ne 0 -or $count -lt 1000) { throw "default DB path lookup failed" }

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: minipro-windows-${{ matrix.ref }}-${{ matrix.msystem }}
          path: out/
          if-no-files-found: error
