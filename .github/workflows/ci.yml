name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri-build won't compile src-tauri without the sidecar it bundles.
      - name: Build minipro sidecar
        uses: ./.github/actions/minipro-sidecar
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: tsc
        run: pnpm exec tsc --noEmit
      - name: eslint
        run: pnpm lint
      - name: vitest
        run: pnpm test
      # No Apple secrets must mean an unsigned build, not a broken one.
      - name: macOS signing gate
        run: scripts/macos/test-signing-gate.sh
      # A dropped connection to Apple's ticket server must mean another try.
      - name: macOS stapler retry
        run: scripts/macos/test-stapler-retry.sh

  build:
    name: Build & bundle · ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (arm64), macos-15-intel = x86_64.
        # macos-14 was retired 2026-11-02 and macos-13 in 2025-12.
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build minipro sidecar
        uses: ./.github/actions/minipro-sidecar
      # Spotlight indexing the freshly mounted interstitial image makes
      # bundle_dmg.sh's eject fail with "Resource busy" on hosted runners.
      - name: Stop Spotlight indexing (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: Build & bundle
        run: pnpm tauri build
      # Run the sidecar from each installed bundle, not the build tree.
      - name: Verify sidecar (macOS)
        if: runner.os == 'macOS'
        run: scripts/minipro/verify-bundle.sh macos target/release/bundle/dmg/*.dmg
      - name: Verify sidecar (Linux)
        if: runner.os == 'Linux'
        run: >-
          scripts/minipro/verify-bundle.sh linux
          target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage
      - name: Verify sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/minipro/verify-bundle.ps1 (Get-Item target/release/bundle/nsis/*-setup.exe).FullName
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: burnwright-${{ matrix.os }}
          path: |
            target/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn

  # The Linux bundles are built on Ubuntu 22.04, the oldest release they're
  # meant for. This installs those same files on each newer LTS, where the
  # system libraries, apt and udev have all moved on, and runs the same
  # checks the build leg ran.
  #
  # It waits for the build legs and then runs whatever they did: a macOS or
  # Windows leg that failed says nothing about the Linux bundles. If the
  # Ubuntu leg is the one that failed, there's no artifact and the download
  # step says so.
  verify-linux:
    name: Verify Linux bundles · ${{ matrix.os }}
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the bundles built on Ubuntu 22.04
        uses: actions/download-artifact@v8
        with:
          name: burnwright-ubuntu-22.04
          path: bundles
      - name: Refresh the package lists
        run: sudo apt-get update
      - name: Verify the .deb and the AppImage
        run: |
          deb="$(find bundles -type f -name '*.deb' -print -quit)"
          appimage="$(find bundles -type f -name '*.AppImage' -print -quit)"
          if [ -z "$deb" ] || [ -z "$appimage" ]; then
            echo "the artifact has no .deb or no AppImage:"
            find bundles -maxdepth 6 | head -n 60
            exit 1
          fi
          scripts/minipro/verify-bundle.sh linux "$deb" "$appimage"
