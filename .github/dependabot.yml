# Weekly version updates. Commit prefix "chore(deps)" keeps these out of
# release-please's version bump; a security fix that matters to users should be
# retitled "fix(deps)" before merge.
#
# Not covered on purpose: vendor/minipro (git submodule). It is pinned to an
# upstream tag and bumped deliberately with `just vendor-update`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
