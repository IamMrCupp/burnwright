# Which licences burnwright accepts in the Rust crates it links, read by
# cargo-about when scripts/notices/generate.sh builds THIRD-PARTY-NOTICES.txt
# (issue #156).
#
# This list is the decision. A crate under anything else fails the
# generator, and CI with it, until someone has looked at that licence and
# either added it here or dropped the crate. For a crate offered under a
# choice ("MIT OR Apache-2.0"), the first one in this list is the one taken.
#
# All of these can be combined into a GPL-3.0-or-later program. MPL-2.0 is
# the one with a condition worth knowing: those files stay MPL, and the
# notices say where their source is.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
    "ISC",
]

# Every platform burnwright ships on. A crate that is only in the Windows
# build is still in the list.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Build scripts and test helpers don't end up in the program.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# burnwright's own crates aren't third parties. (They're `publish = false`.)
private = { ignore = true }

# --- Crates that carry a C library -------------------------------------------
#
# A `-sys` crate's own licence covers its Rust wrapper. The C it compiles in
# has a licence of its own, in a file cargo-about doesn't find by itself.
# Each entry names that file and its checksum: if a new version of the crate
# changes the file, the generator stops and the licence gets read again.

# liblzma, from XZ Utils. xz/COPYING: "liblzma is under the BSD Zero Clause
# License (0BSD)". The GPL and LGPL files beside it cover xz's command-line
# tools and build system, which aren't compiled.
[liblzma-sys.clarify]
license = "MIT AND 0BSD"

[[liblzma-sys.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "a90e2da47bdc152cfb89e1fb09972143056c417ddbf86122babc83d0a8ad81d1"

[[liblzma-sys.clarify.files]]
path = "xz/COPYING.0BSD"
license = "0BSD"
checksum = "0b01625d853911cd0e2e088dcfb743261034a091bb379246cb25a14cc4c74bf1"

# LZFSE, from Apple. The crate ships no licence file for its own MIT part.
[lzfse-sys.clarify]
license = "MIT AND BSD-3-Clause"

[[lzfse-sys.clarify.files]]
path = "lzfse/LICENSE"
license = "BSD-3-Clause"
checksum = "2a20082c2219edbbdb2e862a0566ba4f762a564ade7c04b09250ae4464bc4b32"
