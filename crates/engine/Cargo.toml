[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "burnwright device engine — drives the minipro and flashrom command-line tools"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# A private directory for the image flashrom reads into: it can't read to stdout.
tempfile = "3"
thiserror = "2"

# The Windows driver probe (src/diagnose/win.rs). Same version Tauri pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# Runs MiniproEngine against a fake minipro. The fake is the test binary
# itself and takes real minipro arguments, which libtest would reject, so
# this target brings its own small runner.
[[test]]
name = "minipro_engine"
harness = false

# The same, for FlashromBackend and a fake flashrom.
[[test]]
name = "flashrom_backend"
harness = false
